[package]
name = "transcription-server"
version = "0.1.20"
edition = "2024"

[[bin]]
name = "TranscriptionServer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json", "multipart", "stream"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
if-addrs = "0.15"
url = "2"
clap = { version = "4", features = ["derive"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
